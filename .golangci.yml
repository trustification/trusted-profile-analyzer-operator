version: "2"

run:
  timeout: 5m
  allow-parallel-runners: true

linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    revive:
      rules:
        - name: comment-spacings
  exclusions:
    presets:
      - comments
    rules:
      - path: "api/*"
        linters:
          - lll
      - path: "internal/*"
        linters:
          - dupl
          - lll
      # The TLS configurator deals in OpenSSL/IANA cipher-suite names, which
      # recur as literals in lookup tables and test fixtures. Naming each one as
      # a constant makes those tables harder to read, not easier.
      - path: "pkg/tlsconfigurator/*"
        linters:
          - goconst
      - path: "test/tlsconfigurator/*"
        linters:
          - goconst

formatters:
  enable:
    - gofmt
    - goimports
