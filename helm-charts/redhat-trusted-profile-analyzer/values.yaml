appDomain: change-me
partOf: trustify
replicas: 1

image:
  fullName: quay.io/redhat-user-workloads/trusted-content-tenant/rhtpa-product-0-6-z@sha256:4cb7027e3500d478fb766251e460526f8f67e9c1af3b8651cf7388de672d362f
  pullPolicy: IfNotPresent

rust: {}

proxy: {}

readOnly: false

ingress:
  enabled: true

tls: {}

storage: {}

# Every database block (`database`, `createDatabase`,
# `modules.createImporters.database`) accepts `iamAuth`, which overrides
# `ccoRds.enabled` for that one connection. Leave it unset to follow
# `ccoRds.enabled`; set it to false to keep password authentication for a
# connection — typically the RDS master user that `createDatabase` uses to
# bootstrap the database.
database: {}

# ccoMode: ""  # default | mint | passthrough | manual

# cloudProvider: # aws | gcp — set to enable CCO-managed credentials for S3 storage
cloudCredentials: {}

# ccoRds:         # Uncomment to enable RDS IAM authentication via CCO
#   enabled: false
#   region: ""    # AWS region of the RDS instance
#   # Image providing the `rds-auth-token` helper, run as an init container by the
#   # psql-based jobs (create-database, create-importers) because psql cannot mint
#   # an IAM token itself. Leave it unset to use the image the operator advertises
#   # in `defaultTokenImage`; set it to pin a different image, or when running the
#   # chart standalone, or when the operator was deployed without the optional
#   # RELATED_IMAGE_RDS_AUTH_TOKEN env var.
#   # Required only for connections that actually use IAM auth — deployments
#   # without it, or with `iamAuth: false`, run psql unchanged and never need it.
#   tokenImage: ""
#   # Fallback for tokenImage, injected by the operator from
#   # RELATED_IMAGE_RDS_AUTH_TOKEN (see watches.yaml). Do not set it by hand: the
#   # operator overwrites it on every reconcile. Empty when the operator was
#   # deployed with the config/rds-auth-token component disabled.
#   defaultTokenImage: ""
#   resources: {} # optional resources for the token init container
  #aws:
  #  statementEntries:
  #    - effect: Allow
  #      action: [ "s3:*" ]
  #      resource: "*"
  #  stsIAMRoleARN: ""   # Required for manual mode (STS)
  #gcp:
  #  permissions:
  #    - storage.objects.get

openshift:
  useServiceCa: true

oidc:
  uiScope: ""
  loadUser: true
  clients:
    frontend: {}
    cli:
      clientSecret:

infrastructure:
  port: 9010

metrics:
  enabled: false

tracing:
  enabled: false

collector: {}

exploitIntelligence:
  enabled: false

modules:
  server:
    enabled: true
    replicas: 1
    ingress: {}
    image: {}
    infrastructure: {}
    tracing: {}
    metrics: {}
    rust: {}
    resources:
      requests:
        cpu: 1
        memory: 8Gi
    cacheTTL: "60sec"
    recommendPatterns: []

  importer:
    enabled: true
    replicas: 1
    image: {}
    infrastructure: {}
    tracing: {}
    metrics: {}
    rust: {}
    resources:
      requests:
        cpu: 1
        memory: 8Gi
    concurrency: 1
    # readOnly: false
    workingDirectory:
      size: 32Gi

  createDatabase:
    enabled: false
    image: {}

  migrateDatabase:
    enabled: false
    image: {}
    rust: {}

  createImporters:
    enabled: true
    image: {}
    importers:
      redhat-sboms:
        sbom:
          description: All Red Hat SBOMs
          period: 1d
          source: https://security.access.redhat.com/data/sbom/v1/
          keys:
            - https://security.access.redhat.com/data/97f5eac4.txt#77E79ABE93673533ED09EBE2DCE3823597F5EAC4
          disabled: true
          fetchRetries: 50
      redhat-csaf:
        csaf:
          description: All Red Hat CSAF data
          period: 1d
          source: redhat.com
          disabled: true
          fetchRetries: 50
      cve:
        cve:
          description: CVE list v5
          period: 1d
          source: https://github.com/CVEProject/cvelistV5
          disabled: true
      osv-github:
        osv:
          description: GitHub Advisory Database
          period: 1d
          source: https://github.com/github/advisory-database
          path: advisories
          disabled: true
      quay-redhat-user-workloads:
        quay:
          description: SBOMs from konflux image attachments
          period: 1d
          source: quay.io
          namespace: redhat-user-workloads
          disabled: true
