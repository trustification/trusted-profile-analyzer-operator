appDomain: change-me
partOf: trustify
replicas: 1

image:
  fullName: registry.redhat.io/rhtpa/rhtpa-rhel10@sha256:4cb888509b659a399ddba2f264278921173788c0ebaf1dd5a5a515d9083dbce6
  pullPolicy: IfNotPresent

rust: {}

proxy: {}

readOnly: false

ingress:
  enabled: true

tls: {}

storage: {}

database: {}

openshift:
  useServiceCa: true

oidc:
  uiScope: ""
  loadUser: true
  clients:
    frontend: {}
    cli:
      clientSecret:

infrastructure:
  port: 9010

metrics:
  enabled: false

tracing:
  enabled: false

collector: {}

exploitIntelligence:
  enabled: false

modules:
  server:
    enabled: true
    replicas: 1
    ingress: {}
    image: {}
    infrastructure: {}
    tracing: {}
    metrics: {}
    rust: {}
    resources:
      requests:
        cpu: 1
        memory: 8Gi
    cacheTTL: "60sec"
    recommendPatterns: []

  importer:
    enabled: true
    replicas: 1
    image: {}
    infrastructure: {}
    tracing: {}
    metrics: {}
    rust: {}
    resources:
      requests:
        cpu: 1
        memory: 8Gi
    concurrency: 1
    # readOnly: false
    workingDirectory:
      size: 32Gi

  createDatabase:
    enabled: false
    image: {}

  migrateDatabase:
    enabled: false
    image: {}

  createImporters:
    enabled: true
    image: {}
    importers:
      redhat-sboms:
        sbom:
          description: All Red Hat SBOMs
          period: 1d
          source: https://security.access.redhat.com/data/sbom/v1/
          keys:
            - https://security.access.redhat.com/data/97f5eac4.txt#77E79ABE93673533ED09EBE2DCE3823597F5EAC4
          disabled: true
          fetchRetries: 50
      redhat-csaf:
        csaf:
          description: All Red Hat CSAF data
          period: 1d
          source: redhat.com
          disabled: true
          fetchRetries: 50
      cve:
        cve:
          description: CVE list v5
          period: 1d
          source: https://github.com/CVEProject/cvelistV5
          disabled: true
      osv-github:
        osv:
          description: GitHub Advisory Database
          period: 1d
          source: https://github.com/github/advisory-database
          path: advisories
          disabled: true
      quay-redhat-user-workloads:
        quay:
          description: SBOMs from konflux image attachments
          period: 1d
          source: quay.io
          namespace: redhat-user-workloads
          disabled: true

  tlsConfigurator:
    # OpenShift-only. The reconciler reads the cluster-wide TLS profile from the
    # config.openshift.io APIServer CR, which does not exist on plain
    # Kubernetes.
    #
    #   OpenShift >= 4.22   required -- set this to true; the chart refuses to
    #                       install with it disabled (see allowDisabled)
    #   OpenShift <  4.22   optional
    #   plain Kubernetes    leave false; the chart refuses to install with it
    #                       enabled
    enabled: false
    # Acknowledge running on OpenShift 4.22+ without the configurator. Only
    # consulted when enabled is false; it suppresses the install-time error and
    # accepts that a runtime TLS profile change will not roll the workloads.
    allowDisabled: false
    name: tls-configurator
    image:
      # The configurator ships inside the operator image. When installed via the
      # operator this is overridden with the operator's own running image (see
      # RELATED_IMAGE_TLS_CONFIGURATOR in watches.yaml); this default only
      # applies to a standalone `helm install`.
      fullName: registry.redhat.io/rhtpa/rhtpa-rhel10-operator@sha256:ced5f0bd75a99c14701731fea2cabc7753376228ebc1516556a87a5b2904811f
      pullPolicy: IfNotPresent
    # Post-quantum cryptography: enforce TLS 1.3 + X25519MLKEM768 key exchange
    # and record it in the workload rollout hash.
    pqc:
      enabled: false
    # Deployment names (in this release namespace) to roll out when the
    # cluster-wide TLS configuration changes at runtime. Must match the
    # rendered Deployment names of the TLS-serving workloads.
    targetDeployments:
      - server
    # Periodic drift-correction interval for the reconciler.
    resyncPeriod: 5m
