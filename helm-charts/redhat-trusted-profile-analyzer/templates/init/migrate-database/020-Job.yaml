{{- if .Values.modules.migrateDatabase.enabled }}
{{- $mod := dict "root" . "name" "migrate-db" "component" "database" "module" .Values.modules.migrateDatabase -}}
{{- /* `required` wraps the value, not the deepCopy: deepCopy of a nil value
       panics inside reflect before `required` ever gets to report it. */}}
{{- $db := merge ( deepCopy ( required "Using migrateDatabase requires setting .Values.migrateDatabase" .Values.migrateDatabase ) ) ( deepCopy .Values.database ) -}}
kind: Job
apiVersion: batch/v1
metadata:
  name: {{ include "trustification.common.name" $mod }}
  labels:
    {{- include "trustification.common.labels" $mod | nindent 4 }}

  annotations:
    {{- include "trustification.application.annotations" $mod | nindent 4 }}
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "3"
    helm.sh/hook-weight: "20"
    helm.sh/hook: "pre-install,pre-upgrade"
    helm.sh/hook-delete-policy: before-hook-creation

spec:
  backoffLimit: 1000
  completions: 1
  parallelism: 1
  ttlSecondsAfterFinished: 600

  template:
    metadata:
      labels:
        {{- include "trustification.common.selectorLabels" $mod | nindent 8 }}

    spec:

      restartPolicy: OnFailure

      {{- include "trustification.application.pod" $mod | nindent 6 }}

      volumes:
        {{- include "trustification.storage.volume" $mod | nindent 8 }}
        {{- include "trustification.cco.volumes" $mod | nindent 8 }}
        {{- include "trustification.application.extraVolumes" $mod | nindent 8 }}

      containers:
        - name: job
          {{- include "trustification.common.defaultImage" $mod | nindent 10 }}
          {{- include "trustification.application.container" $mod | nindent 10 }}

          env:
            {{- include "trustification.application.rust.envVars" $mod | nindent 12 }}
            {{- include "trustification.postgres.envVars" ( dict "root" . "database" $db ) | nindent 12 }}
            {{- include "trustification.storage.envVars" $mod | nindent 12 }}
            {{- include "trustification.cco.envVars" $mod | nindent 12 }}
            {{- include "trustification.cco.rds.envVars" ( dict "root" . "database" $db ) | nindent 12 }}

          volumeMounts:
            {{- include "trustification.storage.volumeMount" $mod | nindent 12 }}
            {{- include "trustification.application.extraVolumeMounts" $mod | nindent 12 }}
            {{- include "trustification.cco.volumeMounts" $mod | nindent 12 }}

          command:
            - trustd
            - db
            - migrate

{{- end }}
