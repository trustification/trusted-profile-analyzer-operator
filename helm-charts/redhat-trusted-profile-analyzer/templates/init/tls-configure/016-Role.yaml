{{- if .Values.modules.tlsConfigurator.enabled }}

# Namespaced permissions for the TLS reconciler to roll RHTPA workloads in the
# release namespace when the TLS configuration changes at runtime.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tls-configurator
  labels:
    app.kubernetes.io/name: tls-configurator
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "update", "patch"]
{{- if eq ( include "trustification.tlsConfigurator.operandTls" . ) "true" }}
# Only granted when the reconciler publishes the cluster TLS profile as the
# workloads' own HTTP server settings: it owns that one ConfigMap outright.
# The same condition gates the --operand-config-map flag, so the grant and the
# thing it permits cannot drift apart.
#
# Reads and writes are pinned to that single name, so the reconciler cannot
# read the rest of the namespace's ConfigMaps -- the auth configuration among
# them. "create" is listed separately because the authorizer cannot match a
# resourceName on it: the object does not exist yet, so there is no name to
# check against.
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: [{{ include "trustification.tlsConfigurator.operandConfigMapName" . | quote }}]
  verbs: ["get", "update", "patch"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["create"]
{{- end }}
{{- end }}
