{{- if .Values.modules.tlsConfigurator.enabled }}

# Cluster-scoped permissions for the TLS reconciler:
#   - watch the cluster-wide TLS source of truth (APIServer CR)
#   - read the cluster version (4.22+ gate)
#   - read/update the IngressController TLS profile
#
# Cluster-scoped, so the name is prefixed with the release namespace and name:
# a fixed name would be claimed by whichever release installed first and block
# every later one (see the clusterScopedName helper).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "trustification.tlsConfigurator.clusterScopedName" . }}
  labels:
    app.kubernetes.io/name: tls-configurator
rules:
- apiGroups: ["config.openshift.io"]
  resources: ["apiservers"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["config.openshift.io"]
  resources: ["clusterversions"]
  verbs: ["get", "list"]
# Reading the FeatureGate CR tells the configurator whether the cluster accepts
# TLSProfileSpec.Groups (gated on TLSGroupPreferences) before it writes them.
- apiGroups: ["config.openshift.io"]
  resources: ["featuregates"]
  verbs: ["get", "list"]
- apiGroups: ["operator.openshift.io"]
  resources: ["ingresscontrollers"]
  verbs: ["get", "list", "watch", "update", "patch"]
{{- end }}
