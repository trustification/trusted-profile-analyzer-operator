{{- if .Values.modules.tlsConfigurator.enabled }}

# Long-running TLS reconciler. It performs an initial reconcile on startup
# (covering the previous pre-install/pre-upgrade behaviour) and then watches the
# cluster-wide TLS security profile (APIServer CR "cluster"). When the profile
# changes at runtime, it stamps a hash of the effective TLS configuration onto
# the target Deployments' pod template, triggering a rolling restart so the pods
# pick up the new (post-quantum, TLS 1.3) settings.
kind: Deployment
apiVersion: apps/v1
metadata:
  name: tls-configurator
  labels:
    app.kubernetes.io/name: tls-configurator
spec:
  replicas: 1
  # The reconciler is a singleton that does not do leader election. Each pass
  # reads the cluster profile, then writes the operand ConfigMap and stamps the
  # matching hash on the target Deployments -- so two instances running at once
  # can interleave: the older one lands its stale snapshot after the newer one
  # published the current profile, and the workloads serve the stale settings
  # until a later pass corrects them.
  #
  # The default RollingUpdate strategy creates exactly that overlap, because
  # maxSurge rounds up to 1 at replicas: 1 and the new pod starts before the
  # old one is terminated. Recreate guarantees a single writer instead. The few
  # seconds with no reconciler cost nothing: the new pod reconciles on startup,
  # and a profile change during the gap is caught by that same startup pass.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tls-configurator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tls-configurator
    spec:
      serviceAccountName: tls-configurator
      containers:
        - name: tls-configurator
          # Ships in the operator image, so values.yaml carries no default: the
          # operator fills this in with its own running image
          # (RELATED_IMAGE_TLS_CONFIGURATOR, wired through watches.yaml
          # overrideValues) so the digest always matches the operator that
          # rendered the chart, including in disconnected installs. Only a
          # standalone `helm install` has to supply it, hence the check.
          image: {{ required "modules.tlsConfigurator.enabled is true but no image is set: the configurator ships in the operator image, which the operator injects via RELATED_IMAGE_TLS_CONFIGURATOR. For a standalone `helm install`, set modules.tlsConfigurator.image.fullName to an RHTPA operator image." .Values.modules.tlsConfigurator.image.fullName }}
          imagePullPolicy: {{ .Values.modules.tlsConfigurator.image.pullPolicy }}
          # The image ENTRYPOINT is the operator manager, so select the
          # configurator binary explicitly.
          command:
            - "/usr/local/bin/tls-configurator"
          args:
            - "--action=reconcile"
            - "--enable-pqc={{ .Values.modules.tlsConfigurator.pqc.enabled }}"
            - "--target-namespace={{ .Release.Namespace }}"
            - "--target-deployments={{ join "," .Values.modules.tlsConfigurator.targetDeployments }}"
            - "--resync-period={{ .Values.modules.tlsConfigurator.resyncPeriod }}"
            {{- if eq ( include "trustification.tlsConfigurator.operandTls" . ) "true" }}
            # Publish the resolved profile as the workloads' own HTTP server
            # settings. Without this the reconciler restarts them on a profile
            # change but they keep serving TLS with trustd's compiled-in
            # defaults, which is the shipped behaviour.
            - {{ printf "--operand-config-map=%s" (include "trustification.tlsConfigurator.operandConfigMapName" .) | quote }}
            {{- end }}
{{- end }}
