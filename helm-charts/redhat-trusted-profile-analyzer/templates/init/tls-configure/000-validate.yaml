{{/*
Platform guard for the TLS configurator module. Renders no resources.

The reconciler is OpenShift-specific: it reads the cluster-wide TLS profile from
the config.openshift.io APIServer CR ("cluster") and rolls the target workloads
when that profile changes. The API does not exist on plain Kubernetes.

  OpenShift >= 4.22   the module is required; refuse to render with it disabled
  OpenShift <  4.22   optional -- the reconcile action has no version gate, so
                      it works there, it is just not mandatory
  plain Kubernetes    must stay disabled; refuse to render with it enabled

Both guards can be overridden -- see the messages below -- so an operator can
still make a deliberate choice.
*/}}
{{- $tls := .Values.modules.tlsConfigurator }}
{{- $isOpenShift := eq (include "trustification.openshift.detect" .) "true" }}

{{- if and (not $isOpenShift) $tls.enabled }}
{{- fail (printf `modules.tlsConfigurator.enabled is true, but this cluster does not expose the OpenShift API (route.openshift.io/v1).

The TLS configurator reads the cluster-wide TLS profile from the
config.openshift.io APIServer CR, which does not exist on plain Kubernetes. The
reconciler would fail every attempt and retry indefinitely without ever serving
its purpose.

On plain Kubernetes, leave it off:
    modules.tlsConfigurator.enabled: false   (the chart default)

If this really is OpenShift and detection is wrong, force it with:
    openshift.enabled: true`) }}
{{- end }}

{{- if and $isOpenShift (not $tls.enabled) (not $tls.allowDisabled) }}
{{/*
lookup returns nothing during `helm template` and dry runs, so the version check
is skipped there rather than failing on an unknown version.
*/}}
{{- $clusterVersion := lookup "config.openshift.io/v1" "ClusterVersion" "" "version" }}
{{- if $clusterVersion }}
{{- $version := dig "status" "desired" "version" "" $clusterVersion }}
{{- $parts := splitList "." $version }}
{{- if ge (len $parts) 2 }}
{{- $major := atoi (index $parts 0) }}
{{- $minor := atoi (index $parts 1) }}
{{- if or (gt $major 4) (and (eq $major 4) (ge $minor 22)) }}
{{- fail (printf `modules.tlsConfigurator.enabled is false, but this is OpenShift %s where the TLS configurator is required.

From OpenShift 4.22 the cluster-wide TLS security profile can change at runtime,
and RHTPA workloads only pick up the new settings when something rolls them. The
configurator is what does that.

Enable it:
    modules.tlsConfigurator.enabled: true

To install without it anyway, acknowledge the choice explicitly:
    modules.tlsConfigurator.allowDisabled: true` $version) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}

{{/*
Adherence guard.

APIServer.spec.tlsAdherence: StrictAllComponents says every component on the
cluster must honor the cluster-wide TLS profile. Enabling this module alone
does not achieve that for RHTPA: the reconciler rolls the workloads when the
profile changes, but the server's own listener goes on serving trustd's
compiled-in "modern" profile unless operandTls publishing is on. So a strict
cluster with operandTls off is quietly non-adherent, which is exactly the state
the policy exists to rule out.

Only checked when there is a listener to govern -- useServiceCa. Off OpenShift,
and wherever the server speaks plain HTTP behind a TLS-terminating router,
there is no tls.Config in the RHTPA pods for a cluster profile to apply to, and
the compliance reference puts that out of scope.

Like the version check above, lookup returns nothing under `helm template` and
dry runs, so this is skipped there rather than failing on an unreadable policy.
*/}}
{{- if and $isOpenShift (eq (include "trustification.openshift.useServiceCa" .) "true") }}
{{- if ne (include "trustification.tlsConfigurator.operandTls" .) "true" }}
{{- if not $tls.operandTls.allowDisabled }}
{{- $apiServer := lookup "config.openshift.io/v1" "APIServer" "" "cluster" }}
{{- if $apiServer }}
{{- if eq (dig "spec" "tlsAdherence" "" $apiServer) "StrictAllComponents" }}
{{- fail `This cluster sets APIServer.spec.tlsAdherence: StrictAllComponents, but the RHTPA server would not honor the cluster TLS profile on its own listener.

Strict adherence requires every component to follow the cluster-wide profile.
The TLS configurator rolls the workloads when that profile changes, but the
server keeps serving the profile compiled into trustd (TLS 1.3 only) until the
resolved profile is published to it.

Publish it:
    modules.tlsConfigurator.enabled: true
    modules.tlsConfigurator.operandTls.enabled: true

Note that this can also *loosen* the listener: on a cluster whose profile is
Old or Intermediate, the server drops from TLS 1.3-only to TLS 1.0/1.2. That is
what honoring the cluster profile means.

To install non-adherent anyway, acknowledge the choice explicitly:
    modules.tlsConfigurator.operandTls.allowDisabled: true` }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
