{{- if .Values.modules.tlsConfigurator.enabled }}

# ServiceAccount for the long-running TLS reconciler. Unlike the previous
# one-shot Job, this is a persistent resource (no Helm hook annotations) so the
# reconciler Deployment keeps running and reacting to TLS changes at runtime.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tls-configurator
  labels:
    app.kubernetes.io/name: tls-configurator
{{- end }}
