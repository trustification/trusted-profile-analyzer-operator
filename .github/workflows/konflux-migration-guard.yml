name: Konflux migration guard

# Tekton task bumps that ship a pipeline migration rewrite the pipelines in
# .tekton/, so they need human review. Failing this check keeps the branch red,
# which stops both Renovate automerge (ignoreTests is false) and GitHub
# auto-merge; the approval Renovate gave itself is dismissed as well.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  migration-notes:
    name: Check update notes for task migrations
    if: startsWith(github.head_ref, 'konflux/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Scan the updates table
        id: scan
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 -I .github/scripts/konflux_migration_guard.py

      - name: Block automerge
        if: steps.scan.outputs.migration == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          MESSAGE: >-
            This update contains a Tekton task migration, so it needs human
            review before it can be merged.
        run: |
          gh pr merge --disable-auto "$PR" --repo "$REPO" || true
          gh api "repos/$REPO/pulls/$PR/reviews" \
            --jq '.[] | select(.state == "APPROVED") | .id' |
            while read -r review; do
              gh api -X PUT "repos/$REPO/pulls/$PR/reviews/$review/dismissals" \
                -f message="$MESSAGE" -f event=DISMISS || true
            done

      - name: Fail on task migrations
        if: steps.scan.outputs.migration == 'true'
        run: |
          echo "::error::Task migration found in the update notes; review and merge this PR manually."
          exit 1
