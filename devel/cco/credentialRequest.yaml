apiVersion: cloudcredential.openshift.io/v1
kind: CredentialsRequest
metadata:
  name: rhtpa-demo-cloud-creds
  namespace: openshift-cloud-credential-operator
spec:
  secretRef:
    name: rhtpa-demo-cloud-creds      # must equal <cr-name>-cloud-creds
    namespace: trustify               # the CR's namespace
  # ccoctl builds the role's trust policy from these, one condition per entry:
  #   system:serviceaccount:<secretRef.namespace>:<name>
  # The chart creates no ServiceAccount and sets no modules.*.serviceAccountName,
  # so the trustd pods run as "default" in the namespace above. If you set
  # modules.<name>.serviceAccountName in the CR, list those names here instead.
  serviceAccountNames:
    - default
  cloudTokenPath: /var/run/secrets/openshift/serviceaccount/token
  providerSpec:
    apiVersion: cloudcredential.openshift.io/v1
    kind: AWSProviderSpec   # AWS
    statementEntries:
      - effect: Allow
        action:
          - "s3:GetObject"
          - "s3:PutObject"
          - "s3:DeleteObject"
          - "s3:ListBucket"
          - "s3:GetBucketLocation"
          - "s3:ListBucketMultipartUploads"
          - "s3:AbortMultipartUpload"
          - "s3:ListMultipartUploadParts"
          # Uncomment when using RDS IAM auth (ccoRds.enabled in the CR, see
          # trusted-profile-analyzer-ocp-cco-rds.yaml). Must be present *before*
          # ccoctl creates the role, otherwise the role cannot log into RDS.
          #- "rds-db:connect"
        resource: "*"
