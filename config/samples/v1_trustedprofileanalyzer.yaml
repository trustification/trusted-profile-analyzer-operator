apiVersion: rhtpa.io/v1
kind: TrustedProfileAnalyzer
metadata:
  name: trustedprofileanalyzer-sample
spec:
  # Default values copied from <project_dir>/helm-charts/redhat-trusted-profile-analyzer/values.yaml
  appDomain: change-me
  collector: {}
  database: {}
  infrastructure:
    port: 9010
  ingress: {}
  metrics:
    enabled: false
  modules:
    createDatabase:
      enabled: false
      image: {}
    createImporters:
      enabled: false
      image: {}
      # Example: Quay importer with K8s-managed credentials (env-based, production pattern)
      # importers:
      #   quay-example:
      #     quay:
      #       description: SBOMs from Quay
      #       period: 1d
      #       source: quay.io
      #       namespace: my-namespace
      #       auth:
      #         method:
      #           type: bearer
      #           token:
      #             # Production: use External Secrets Operator + Vault (or AWS/GCP Secret Manager)
      #             # to provision the K8s Secret automatically. For a quick test:
      #             #   kubectl create secret generic quay-api-token --from-literal=QUAY_API_TOKEN=<token>
      #             # Then patch the operator-generated importer Deployment to expose it
      #             # (the operator does not support envFrom via CR spec — use Kustomize):
      #             #   spec.template.spec.containers[name=importer].envFrom:
      #             #     - secretRef:
      #             #         name: quay-api-token
      #             type: env
      #             value: QUAY_API_TOKEN
      importers: {}
    importer:
      concurrency: 1
      enabled: true
      image: {}
      infrastructure: {}
      metrics: {}
      replicas: 1
      resources:
        requests:
          cpu: 1
          memory: 8Gi
      rust: {}
      tracing: {}
      workingDirectory:
        size: 32Gi
    migrateDatabase:
      enabled: false
      image: {}
    server:
      enabled: true
      image: {}
      infrastructure: {}
      ingress: {}
      metrics: {}
      replicas: 1
      resources:
        requests:
          cpu: 1
          memory: 8Gi
      rust: {}
      tracing: {}
  oidc:
    clients:
      cli:
        clientSecret: null
      frontend: {}
  openshift:
    useServiceCa: true
  partOf: trustify
  replicas: 1
  rust: {}
  storage: {}
  tls: {}
  tracing:
    enabled: false
  
  
