# Adds namespace to all resources.
namespace: rhtpa-operator-system

# Value of this field is prepended to the
# names of all resources, e.g. a deployment named
# "wordpress" becomes "alices-wordpress".
# Note that it should also match with the prefix (text before '-') of the namespace
# field above.
namePrefix: rhtpa-operator-

# Labels to add to all resources and selectors.
#labels:
#- includeSelectors: true
#  pairs:
#    someName: someValue

resources:
- ../crd
- ../rbac
- ../manager
# [PROMETHEUS] To enable prometheus monitor, uncomment all sections with 'PROMETHEUS'.
#- ../prometheus
# [METRICS] Expose the controller manager metrics service.
- metrics_service.yaml
# [NETWORK POLICY] Protect the /metrics endpoint and Webhook Server with NetworkPolicy.
# Only Pod(s) running a namespace labeled with 'metrics: enabled' will be able to gather the metrics.
# Only CR(s) which requires webhooks and are applied on namespaces labeled with 'webhooks: enabled' will
# be able to communicate with the Webhook Server.
#- ../network-policy

# [RDS_AUTH_TOKEN] Advertise the image carrying the `rds-auth-token` helper via
# RELATED_IMAGE_RDS_AUTH_TOKEN on the manager, and — in the OLM bundle — as a
# relatedImages entry. Comment out the two lines below to disable it: the env
# var and the relatedImages entry disappear, and clusters that need the helper
# must then set `ccoRds.tokenImage` in the TrustedProfileAnalyzer CR. Only
# deployments using RDS IAM authentication for the psql-based init jobs
# (create-database, create-importers) need it at all.
components:
- ../rds-auth-token

# [TLS_CONFIGURATOR] The TLS configurator binary ships inside the operator image
# (see Dockerfile), so RELATED_IMAGE_TLS_CONFIGURATOR must track whatever image
# the manager runs — watches.yaml expands it into
# modules.tlsConfigurator.image.fullName. config/manager/manager.yaml can only
# carry the `controller:latest` placeholder; without this replacement that
# placeholder ships verbatim into the CSV env var and relatedImages, and
# `make bundle` fails trying to resolve it to a digest.
#
# Pin a different image: replace the value in config/manager/manager.yaml and
# comment out this block, which would otherwise overwrite it.
replacements:
- source:
    fieldPath: spec.template.spec.containers.[name=manager].image
    kind: Deployment
    name: controller-manager
  targets:
  - fieldPaths:
    - spec.template.spec.containers.[name=manager].env.[name=RELATED_IMAGE_TLS_CONFIGURATOR].value
    select:
      kind: Deployment
      name: controller-manager

# Uncomment the patches line if you enable Metrics, and/or are using webhooks and cert-manager
patches:
# [METRICS] The following patch will enable the metrics endpoint using HTTPS and the port :8443.
# More info: https://book.kubebuilder.io/reference/metrics
- path: manager_metrics_patch.yaml
  target:
    kind: Deployment
