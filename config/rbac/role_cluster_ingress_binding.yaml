apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/name: rhtpa-operator
    app.kubernetes.io/managed-by: kustomize
  name: ingress-cluster-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: allow-get-ingress-cluster
subjects:
  # Unprefixed name + "system" namespace, so kustomize's nameReference and
  # namespace transformers rewrite both. See role_cluster_rbac_manager_binding.yaml.
  - kind: ServiceAccount
    name: controller-manager
    namespace: system

